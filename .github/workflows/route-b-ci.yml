name: route-B-v2 quality gates
on:
  push:
    branches: [route-B-v2, route-B-v2-hardening]
  pull_request:
    branches: [route-B-v2]
    paths: ["packages/**","services/**","apps/web/**","deploy/**","scripts/**","tests/**",".github/**"]
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    env:
      DWS_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install runtime/test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/api/requirements.txt -r services/worker/requirements.txt pyyaml
      - name: Syntax / unit / Redis Lua integration
        run: |
          python -m compileall -q packages services scripts tests
          python -m unittest discover -s tests -v
      - name: Bash syntax
        run: bash -n scripts/*.sh
  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm install --no-audit --no-fund
      - run: npm run build
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install pyyaml
      - name: Validate each LAN host config
        run: |
          mkdir -p runtime
          cat > runtime/controller.env <<'EOF'
          CONTROLLER_IP=192.168.1.101
          REDIS_PASSWORD=exampleRandomValueLongEnoughForCIOnly_123
          INGEST_TOKEN=exampleRandomValueLongEnoughForCIOnly_123
          ADMIN_TOKEN=exampleRandomValueLongEnoughForCIOnly_123
          OPENSEARCH_HEAP=1g
          EOF
          cat > runtime/worker.env <<'EOF'
          REDIS_HOST=192.168.1.101
          REDIS_PASSWORD=exampleRandomValueLongEnoughForCIOnly_123
          API_URL=http://192.168.1.101:8000
          INGEST_TOKEN=exampleRandomValueLongEnoughForCIOnly_123
          DOMAIN_DELAY_MS=3000
          WORKER_CONCURRENCY=4
          WORKER_ID=ubuntu-a
          EOF
          python scripts/render-os-config.py os-a 192.168.1.101 192.168.1.102 192.168.1.103
          set -a
          . runtime/search.env
          set +a
          docker compose --env-file runtime/controller.env -f deploy/controller.yml config --quiet
          docker compose -f deploy/worker.yml config --quiet
          python scripts/render-os-config.py os-b 192.168.1.101 192.168.1.102 192.168.1.103 --out /tmp/os-b
          set -a
          . /tmp/os-b/search.env
          set +a
          docker compose -f deploy/search-node.yml config --quiet
          python scripts/render-os-config.py os-c 192.168.1.101 192.168.1.102 192.168.1.103 --out /tmp/os-c
          set -a
          . /tmp/os-c/search.env
          set +a
          docker compose -f deploy/witness.yml config --quiet
          python scripts/render-os-config.py os-a 192.168.1.101 192.168.1.102 192.168.1.103 --post-bootstrap
          python - <<'PY'
          from pathlib import Path
          import yaml
          cfg=yaml.safe_load(Path("runtime/opensearch.yml").read_text())
          assert "cluster.initial_cluster_manager_nodes" not in cfg
          PY

  opensearch-smoke:
    # Actually builds the ICU-enabled OpenSearch image and verifies its analyzer,
    # a Chinese-language document insert, and BM25 retrieval on a disposable runner.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r services/api/requirements.txt
      - name: Build production ICU image
        run: docker build -t dws-v2-icu-smoke -f deploy/opensearch/Dockerfile .
      - name: Start ephemeral single-node OpenSearch
        run: |
          sudo sysctl -w vm.max_map_count=262144
          docker run -d --name dws-ci-os \
            --memory=3g \
            -e discovery.type=single-node \
            -e DISABLE_SECURITY_PLUGIN=true \
            -e DISABLE_INSTALL_DEMO_CONFIG=true \
            -e OPENSEARCH_JAVA_OPTS='-Xms512m -Xmx512m' \
            -p 127.0.0.1:19200:9200 \
            dws-v2-icu-smoke
      - name: Real index/search smoke
        run: PYTHONPATH=. python scripts/smoke-opensearch.py http://127.0.0.1:19200
      - name: Container logs
        if: failure()
        run: docker logs --tail 160 dws-ci-os || true
      - name: Remove ephemeral container
        if: always()
        run: docker rm -f dws-ci-os >/dev/null 2>&1 || true
