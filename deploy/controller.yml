name: dws-v2-controller
services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --save 60 1000 --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "${CONTROLLER_IP}:6379:6379"
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 15s
      timeout: 5s
      retries: 8
    logging: {options: {max-size: "30m", max-file: "3"}}
  opensearch:
    build:
      context: ..
      dockerfile: deploy/opensearch/Dockerfile
    container_name: dws-v2-os-a
    restart: unless-stopped
    environment:
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms${OS_HEAP:-1g} -Xmx${OS_HEAP:-1g}"
    volumes:
      - os-a-data:/usr/share/opensearch/data
      - ../runtime/opensearch.yml:/usr/share/opensearch/config/opensearch.yml:ro
    ports:
      - "${OS_PUBLISH_IP}:9300:9300"
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 65536, hard: 65536}
    logging: {options: {max-size: "100m", max-file: "3"}}
  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    env_file: ../runtime/controller.env
    environment:
      REDIS_HOST: redis
      OPENSEARCH_HOST: opensearch
    ports: ["${CONTROLLER_IP}:8000:8000"]
    depends_on:
      redis: {condition: service_healthy}
      opensearch: {condition: service_started}
    logging: {options: {max-size: "40m", max-file: "3"}}
  scheduler:
    build:
      context: ..
      dockerfile: services/scheduler/Dockerfile
    restart: unless-stopped
    env_file: ../runtime/controller.env
    environment:
      REDIS_HOST: redis
    depends_on:
      redis: {condition: service_healthy}
    logging: {options: {max-size: "30m", max-file: "3"}}
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports: ["${CONTROLLER_IP}:3000:3000"]
    depends_on: [api]
    logging: {options: {max-size: "30m", max-file: "3"}}
volumes:
  redis-data:
    name: dws_v2_redis_data
  os-a-data:
    name: dws_v2_os_a_data
